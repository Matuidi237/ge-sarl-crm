# CRM GE SARL : déploiement VPS derrière Nginx Proxy Manager.
#
# Les noms de conteneurs et de volume sont préfixés « ge-crm » : le VPS héberge
# déjà le CRM EasyTech, dont les conteneurs s'appellent crm-db, crm-backend et
# crm-web. Deux conteneurs ne peuvent pas porter le même nom, et un volume
# partagé mélangerait les deux bases.
#
# Aucun port n'est publié sur l'hôte : le proxy joint le conteneur « crm-web »
# par son nom, sur le réseau Docker partagé. La base et l'API ne sont accessibles
# que depuis le réseau interne.
#
# Variables attendues dans un fichier .env placé à côté de ce fichier
# (voir .env.example).

name: ge-sarl-crm

services:
  db:
    image: postgres:16-alpine
    container_name: ge-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Sans cela, une réinitialisation accidentelle du volume repartirait sans mot de passe.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - ge_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - interne

  backend:
    build: ./backend
    container_name: ge-crm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      # Laisser vides tant que Resend n'est pas configuré : les envois restent simulés.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Fuseau de l'agence : les rapports journaliers et les échéances se
      # comptent en jours de Douala, pas en jours UTC.
      TZ: Africa/Douala
    # L'image Debian n'embarque ni wget ni curl : on interroge avec node,
    # dont le fetch global est disponible depuis la version 18.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - interne

  web:
    build: ./frontend
    container_name: ge-crm-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - interne
      # Réseau partagé avec Nginx Proxy Manager : c'est par là que le proxy entre.
      - webproxy

volumes:
  ge_crm_pgdata:

networks:
  interne:
    driver: bridge
  webproxy:
    external: true
